<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0d1117"/>
  <!-- Subtle grid lines -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#1e2733" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#1e2733" stroke-width="1"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#00e5a0"/>
  <!-- Top border -->
  <rect x="0" y="0" width="1200" height="2" fill="#1e2733"/>
  <!-- Bottom border -->
  <rect x="0" y="628" width="1200" height="2" fill="#1e2733"/>

  <!-- Logo: AI -->
  <text x="80" y="310" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="120" font-weight="900" fill="#00e5a0">AI</text>
  <!-- Logo: Sports -->
  <text x="240" y="310" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="120" font-weight="900" fill="#4a7a6a">Sports</text>

  <!-- Tagline -->
  <text x="80" y="375" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="30" font-weight="600" fill="#a0aec0" letter-spacing="6">PREDICTIONS</text>

  <!-- Divider line -->
  <rect x="80" y="400" width="240" height="2" fill="#1e2733"/>

  <!-- Description -->
  <text x="80" y="445" font-family="'Barlow', Arial, sans-serif" font-size="22" fill="#4a5568">AI-powered NBA &amp; MLB game predictions</text>
  <text x="80" y="475" font-family="'Barlow', Arial, sans-serif" font-size="22" fill="#4a5568">Win probability · Over/Under analysis · Free daily picks</text>

  <!-- Sport badges -->
  <rect x="80" y="505" width="110" height="36" rx="6" fill="rgba(0,229,160,0.1)" stroke="#00e5a0" stroke-width="1" stroke-opacity="0.3"/>
  <text x="135" y="528" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="18" font-weight="800" fill="#00e5a0" text-anchor="middle">🏀 NBA</text>
  <rect x="204" y="505" width="110" height="36" rx="6" fill="rgba(0,229,160,0.1)" stroke="#00e5a0" stroke-width="1" stroke-opacity="0.3"/>
  <text x="259" y="528" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="18" font-weight="800" fill="#00e5a0" text-anchor="middle">⚾ MLB</text>

  <!-- Right decorative element: mock win probability bar -->
  <rect x="720" y="220" width="400" height="180" rx="10" fill="#161b22" stroke="#1e2733" stroke-width="1"/>
  <text x="740" y="252" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="11" font-weight="700" fill="#3a4a5a" letter-spacing="3">WIN PROBABILITY</text>
  <!-- Home team -->
  <text x="740" y="302" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="48" font-weight="900" fill="#e2e8f0">LAL</text>
  <text x="1060" y="302" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="48" font-weight="900" fill="#2d3748" text-anchor="end">BOS</text>
  <text x="900" y="302" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="18" font-weight="700" fill="#2d3748" text-anchor="middle">VS</text>
  <!-- Probability bar -->
  <rect x="740" y="320" width="380" height="6" rx="3" fill="#1e2733"/>
  <rect x="740" y="320" width="238" height="6" rx="3" fill="#00e5a0"/>
  <!-- Pct labels -->
  <text x="740" y="348" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="16" font-weight="800" fill="#00e5a0">62.5%</text>
  <text x="1120" y="348" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="16" font-weight="800" fill="#4a5568" text-anchor="end">37.5%</text>
  <!-- O/U line -->
  <rect x="740" y="365" width="380" height="30" rx="4" fill="rgba(0,229,160,0.06)"/>
  <text x="750" y="385" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" fill="#4a5568">O/U 215.5</text>
  <text x="1110" y="385" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" fill="#00e5a0" text-anchor="end">OVER 55%</text>
</svg>
